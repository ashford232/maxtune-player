name: maxtune_player
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  hugeicons_pro: ^0.0.3
  flutter_riverpod: ^3.4.3
  shared_preferences: ^2.5.6
  path: ^1.9.1
  lite_router: ^0.1.2
  just_audio: ^0.10.6
  file_selector: ^1.1.0
  audio_metadata_reader: ^1.8.1
  super_drag_and_drop: ^0.9.1
  skeletonizer: ^3.0.0
  window_manager: ^0.5.2
  just_audio_windows_plus: ^0.5.6
  mpv_audio_kit: ^0.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
  fonts:
    - family: AsapSharp
      fonts:
        - asset: assets/fonts/AsapSharp.ttf
        - asset: assets/fonts/AsapSharpItalic.ttf
          style: italic